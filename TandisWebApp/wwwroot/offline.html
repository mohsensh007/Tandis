<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>تندیس</title>
    <style>
        :root { color-scheme: dark; font-family: Tahoma, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 0, #24396a, #0f172a 65%); color: #fff; text-align: center; }
        main { width: min(88vw, 360px); padding: 28px 22px; border: 1px solid rgba(255,255,255,.16); border-radius: 22px; background: rgba(255,255,255,.08); box-shadow: 0 18px 48px rgba(0,0,0,.32); }
        img { width: 88px; height: 88px; object-fit: contain; margin-bottom: 12px; }
        h1 { margin: 0 0 10px; font-size: 1.15rem; }
        p { margin: 0; color: #bcd0e4; line-height: 1.9; font-size: .9rem; }
    </style>
</head>
<body>
    <main>
        <img src="/images/app-icon-192.png" alt="تندیس" />
        <h1>ارتباط اینترنتی برقرار نیست</h1>
        <p>بعد از وصل‌شدن اینترنت، صفحه را دوباره باز کنید.</p>
    </main>
</body>
</html>
